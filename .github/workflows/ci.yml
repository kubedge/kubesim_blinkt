name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# --- private-deps-auth (disabled by default; spec `private-repo-free-org`) ---------
# Enable when this repo pins a PRIVATE sibling — a git source in pyproject.toml/uv.lock
# or go.mod: a runner has no ssh key and no token, so the sibling answers 404 "not
# found" (never 403) and `uv sync` reads as "repository not found", not as auth.
# Needs PRIVATE_DEPS_TOKEN (fine-grained PAT, Contents: read on the siblings) in BOTH
# GitHub stores — Actions AND Dependabot — `bin/sync-secrets.py push PRIVATE_DEPS_TOKEN
# --app both --apply`; a Dependabot-triggered run reads only the Dependabot store.
# Uncomment the step into every job that resolves dependencies (lint, type-check, test),
# right after `actions/checkout`, byte-identical, so the 3-way merge on the next
# broadcast stays clean. uv and go both shell out to git for a git source, so the
# insteadOf rewrite covers both; a private PACKAGE INDEX needs UV_INDEX_<NAME>_USERNAME /
# _PASSWORD (or GOPROXY credentials) instead — not this block.
#
#      - name: private-deps-auth
#        env:
#          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
#          PRIVATE_DEPS_PROBE: https://github.com/<org>/<sibling>.git # one private sibling
#        run: |
#          if [[ -z "$PRIVATE_DEPS_TOKEN" ]]; then
#            echo "::error::PRIVATE_DEPS_TOKEN is empty for this run (Dependabot runs read only the Dependabot store)"
#            exit 1
#          fi
#          base="https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/"
#          git config --global url."$base".insteadOf "https://github.com/"
#          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
#          git config --global --add url."$base".insteadOf "git@github.com:"
#          echo "GOPRIVATE=github.com/<org>/*" >> "$GITHUB_ENV" # go: skip proxy + sumdb for the org
#          git ls-remote --exit-code "$PRIVATE_DEPS_PROBE" HEAD >/dev/null # a bad token fails HERE, readably

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    outputs:
      python: ${{ steps.detect.outputs.python }}
      bash: ${{ steps.detect.outputs.bash }}
      bats: ${{ steps.detect.outputs.bats }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if compgen -G "bin/*" >/dev/null || compgen -G "tests/*.bats" >/dev/null; then
            echo "bash=true" >> "$GITHUB_OUTPUT"
          else
            echo "bash=false" >> "$GITHUB_OUTPUT"
          fi
          # `bats` gates the actual test run — true only when .bats files exist,
          # so a project with bin/ scripts but no bats suite doesn't fail on
          # `bats tests/` ("Found no tests"). `bash` still gates shell linting.
          if compgen -G "tests/*.bats" >/dev/null; then
            echo "bats=true" >> "$GITHUB_OUTPUT"
          else
            echo "bats=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f go.mod ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: detect
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Held at v7 — the LAST major with a bare `@vN` tag. setup-uv v8.0.0 stopped
      # publishing major/minor tags on purpose (supply-chain hardening, post
      # tj-actions), so `@v8`, `@v9` and `@v10` DO NOT EXIST as refs: a workflow
      # naming one fails to resolve the action before a single step runs. That is
      # what broke fresh bootstraps, not the v9/v10 behaviour changes.
      # Moving forward is therefore NOT a major-tag bump — it needs a full version
      # (`@v10.0.1`) or a commit SHA, applied to all three occurrences in this file.
      # Check the tag resolves before shipping any bump here:
      #   gh api repos/astral-sh/setup-uv/git/ref/tags/<tag>
      - name: Install uv
        if: needs.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v7
      - name: ruff
        if: needs.detect.outputs.python == 'true'
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
      # The downloads get their own step and the 5-minute bound: apt-get and curl are where
      # runs hang. The check itself is bounded only by the job, so a large repo is not cut off.
      - name: Install shellcheck + shfmt
        timeout-minutes: 5
        if: needs.detect.outputs.bash == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" -o /tmp/shfmt
          chmod +x /tmp/shfmt && sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: shellcheck + shfmt
        if: needs.detect.outputs.bash == 'true'
        run: |
          # Only scan tracked shell files — avoids recursing into .venv, etc.
          # bin/ also holds Python tools (bin/check-doc-set.py); shellcheck rejects those.
          mapfile -t sh_files < <(git ls-files '*.sh' '*.bash' 'bin/*' | grep -Ev '^(\.venv|node_modules|dist|build)/|\.py$' || true)
          if [[ ${#sh_files[@]} -gt 0 ]]; then
            shellcheck "${sh_files[@]}"
            shfmt -d -i 2 -ci -bn "${sh_files[@]}"
          fi

  type-check:
    name: type-check
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv sync --locked
          uv run mypy src

  test:
    name: test
    needs: detect
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        if: needs.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v7
      - name: pytest
        if: needs.detect.outputs.python == 'true'
        run: |
          uv sync --locked
          uv run pytest
      - name: Install bats
        timeout-minutes: 5  # apt-get is where runs hang; the suite itself is bounded by the job
        if: needs.detect.outputs.bats == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
      - name: bats
        if: needs.detect.outputs.bats == 'true'
        run: bats tests/

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Use the gitleaks binary directly — gitleaks-action requires a paid
      # license for org-owned repos, and we don't need its PR-comment features.
      - name: Install gitleaks
        timeout-minutes: 5  # curl is where runs hang; the full-history scan is bounded by the job
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
      - name: gitleaks
        run: /tmp/gitleaks detect --source . --redact --verbose

  # Go / operator jobs — gated on go.mod presence (per go-stack-profile).
  # All four are skipped on python/bash-only repos (detect.outputs.go == 'false').
  go-build:
    name: go-build
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  go-vet:
    name: go-vet
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  go-test:
    name: go-test
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race -coverprofile=cover.out

  golangci-lint:
    name: golangci-lint
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A stalled runner step otherwise holds the job to GitHub's 6 h ceiling and drains the
    # org's shared Actions minutes; a healthy run of any job here takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Deliberately held at v6 + golangci-lint v1 while every other pin in this
      # file moved to current (2026-08-18). This one is NOT a standalone bump:
      # golangci-lint-action v7+ requires golangci-lint v2, whose config schema
      # is incompatible (`linters.default` / `linters.exclusions` replace
      # `disable-all` / `issues.exclude-rules`) and whose module path gained a
      # `/v2/` segment. meta/bootstrap/stacks/go.sh generates a v1 `.golangci.yml` # shipped-path-provenance
      # and pins GOLANGCI_VERSION=v1.61.0 in the Makefile, so action + config +
      # binary are internally consistent today; bumping the action alone breaks
      # every bootstrapped go project. Migrating all three together is the real
      # change, and it needs a go toolchain to verify.
      #
      # Note the retrofit path behaves differently: `retrofit-project.sh` ships
      # this workflow without running go.sh, so a retrofitted repo has no
      # `.golangci.yml` at all and runs the action's own defaults. That is why
      # kubedge/kubesim_lte is green on action v9 — it is not evidence that a
      # bootstrapped project would be.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
