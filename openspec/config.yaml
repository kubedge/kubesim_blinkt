schema: spec-driven

context: |
  Role: STANDALONE in the kubedge org - no intra-org Go dependency (no operator-base /
  kubesim_base). Blinkt LED simulator for the Raspberry Pi Blinkt hardware (arm).

  Build / versioning:
    - Rust (since port-to-rust; the Go code ended at 0.4.0). Cargo runs in the pinned
      rust:1.99 container (hack/cargo.sh); images are static musl, buildx multi-arch
      linux/arm64 + linux/amd64 (arm64 primary: Apple-Silicon dev + Pi armv8).
      NO base realign (nothing to realign to).

rules:
  spec:
    - Describe CURRENT behavior; do not spec aspirational features.
