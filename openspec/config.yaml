schema: spec-driven

context: |
  Role: STANDALONE in the kubedge org - no intra-org Go dependency (no operator-base /
  kubesim_base). Blinkt LED simulator for the Raspberry Pi Blinkt hardware (arm).

  Build / versioning:
    - Two implementations side by side, building the same /blinkt5: Go (go-blinkt/, go 1.26;
      default; image kubesim_blinkt_go, also published as kubesim_blinkt) and Rust (rust-blinkt/; image
      kubesim_blinkt_rs). Both are held to the shared tests/fixtures and to each
      other (make interop). Cargo runs in the pinned rust:1.99 container (hack/cargo.sh).
      Images are buildx multi-arch linux/arm64 + linux/amd64 (arm64 primary: Apple-Silicon dev +
      Pi armv8), static, FROM scratch. NO base realign (nothing to realign to).

rules:
  specs:
    - Describe CURRENT behavior; do not spec aspirational features.
