# kubesim_blinkt: one pod per Raspberry Pi that has a Pimoroni Blinkt! fitted.
#
#   kubectl label node <node> blinktInstalled=true
#   kubectl apply -f deploy/kubesim-blinkt.yaml
#
# The pod drives BCM GPIO23/24 through /dev/gpiochip0, holding the lines only while
# it writes a frame. It shares the LEDs with the blinkt sidecars of the kubesim
# simulator charts through the host's /etc/kubedge (blinkt.lock + blinkt_state.json):
# each process draws only its own pixels, merged into one frame.
# Success in the log:  "blinkt: GPIO ready (...)" then
#                      "blinkt: running algorithm=... shared state=/etc/kubedge"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubesim-blinkt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesim-blinkt-config
  namespace: kubesim-blinkt
data:
  # Read once at start-up (subPath mounts do not refresh): after editing, run
  #   kubectl -n kubesim-blinkt rollout restart daemonset/kubesim-blinkt
  blinkt_conf.yaml: |
    ---
    # all 8 LEDs in distinct colours, blinking every 500 ms
    algorithm: fixed
    intensity: 3
    frequency: 500
    pixel0: [255, 0, 0]
    pixel1: [255, 128, 0]
    pixel2: [255, 255, 0]
    pixel3: [0, 255, 0]
    pixel4: [0, 255, 255]
    pixel5: [0, 0, 255]
    pixel6: [128, 0, 255]
    pixel7: [255, 255, 255]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubesim-blinkt
  namespace: kubesim-blinkt
  labels:
    app.kubernetes.io/name: kubesim-blinkt
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesim-blinkt
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # One blinkt per node from this DaemonSet; others share via /etc/kubedge.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesim-blinkt
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        blinktInstalled: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # SIGTERM clears the LEDs and releases the lines within about a second.
      terminationGracePeriodSeconds: 10
      containers:
        - name: blinkt
          image: docker.io/kubedge1/kubesim_blinkt:0.5.2
          imagePullPolicy: IfNotPresent
          env:
            - name: BLINKT_CONFIG
              value: /etc/kubedge/blinkt_conf.yaml
            - name: BLINKT_STATE_DIR
              value: /etc/kubedge
          securityContext:
            # Needed for /dev/gpiochip0: the container runtime only allows host
            # devices into the device cgroup for privileged containers.
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            # Same layout as the simulator charts' blinkt sidecars: the host
            # directory for shared LED state, with the config file on top.
            - name: kubedge
              mountPath: /etc/kubedge
            - name: config
              mountPath: /etc/kubedge/blinkt_conf.yaml
              subPath: blinkt_conf.yaml
              readOnly: true
      volumes:
        - name: kubedge
          hostPath:
            path: /etc/kubedge
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: kubesim-blinkt-config
