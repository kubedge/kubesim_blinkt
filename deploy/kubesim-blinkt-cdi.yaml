# Test pattern: one pod per node labelled blinktInstalled=true, all 8 LEDs in distinct
# colours, blinking every 500 ms. Needs: blinkt-operator in cdi mode, or dra-driver/deploy (CDI on in containerd).
#   kubectl label node <node> blinktInstalled=true
#   kubectl apply -f deploy/kubesim-blinkt-cdi.yaml
# The pod claims all 8 LEDs of its node through DRA: simulator pods asking for a
# pixel on the same node stay Pending until this is removed.
