    chart: kubesim-blinkt-0.2.0
    release: test-pattern
    heritage: Helm
data:
  blinkt_conf.yaml: |
    algorithm: fixed
    intensity: 3
    frequency: 500
    pixel0: [255,0,0]
    pixel1: [255,128,0]
    pixel2: [255,255,0]
    pixel3: [0,255,0]
    pixel4: [0,255,255]
    pixel5: [0,0,255]
    pixel6: [128,0,255]
