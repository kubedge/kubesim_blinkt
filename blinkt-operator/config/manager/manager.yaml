apiVersion: v1
kind: Namespace
metadata:
  name: blinkt-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinkt-operator
  labels:
    app.kubernetes.io/name: blinkt-operator
spec:
  replicas: 1
  # Single replica without leader election: never run two managers during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blinkt-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blinkt-operator
    spec:
      serviceAccountName: blinkt-operator
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: manager
          image: blinkt-operator
          command: ["/manager"]
          # No lease to lose when a Pi control plane's API server stalls
          # (crash-looped on piclustera with election on). For more than one
          # replica, use --leader-elect=true and a RollingUpdate strategy.
          args: ["--leader-elect=false"]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # The node agent runs from the operator's own image.
            - name: AGENT_IMAGE
              value: blinkt-operator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 96Mi}
