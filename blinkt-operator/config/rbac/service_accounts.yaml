# The operator's own identity and the node components it deploys. RBAC for
# the node components ships here, statically, so the operator never needs to
# grant permissions itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blinkt-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blinkt-dra-driver
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blinkt-node-agent
