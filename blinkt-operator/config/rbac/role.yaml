---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blinkt-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - blinkt.kubedge.io
  resources:
  - blinktconfigs
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - blinkt.kubedge.io
  resources:
  - blinktconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - blinkt.kubedge.io
  resources:
  - blinktconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - resource.k8s.io
  resources:
  - deviceclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  - resourceslices
  verbs:
  - get
  - list
  - watch
