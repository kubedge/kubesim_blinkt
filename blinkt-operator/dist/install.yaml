apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: blinkt-operator
  name: blinkt-operator
  namespace: blinkt-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blinkt-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blinkt-operator
    spec:
      containers:
      - args:
        - --leader-elect=false
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AGENT_IMAGE
          value: docker.io/kubedge1/blinkt-operator:0.5.3
        image: docker.io/kubedge1/blinkt-operator:0.5.3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        resources:
          limits:
            memory: 96Mi
          requests:
            cpu: 10m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: blinkt-operator
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
