apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: blinktconfigs.blinkt.kubedge.io
spec:
  group: blinkt.kubedge.io
  names:
    kind: BlinktConfig
    listKind: BlinktConfigList
    plural: blinktconfigs
    shortNames:
    - blinkt
    singular: blinktconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.mode
      name: Active
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.nodes.ready
      name: Nodes
      type: string
    - jsonPath: .status.devices
      name: Devices
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BlinktConfig selects how the cluster runs its Blinkt! LEDs. The operator
          acts only on the instance named "cluster".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BlinktConfigSpec is the desired Blinkt! setup of the cluster.
            properties:
              defaults:
                description: |-
                  Defaults is the PixelConfig carried by the DeviceClass; claims
                  override it field by field.
                properties:
                  algorithm:
                    description: |-
                      Algorithm: steady, fixed5 (lit frequency ms, dark 10 ms) or fixed
                      (lit and dark frequency ms each).
                    enum:
                    - steady
                    - fixed5
                    - fixed
                    type: string
                  color:
                    description: Color is red, green, blue, each 0-255.
                    items:
                      format: int32
                      type: integer
                    maxItems: 3
                    minItems: 3
                    type: array
                  frequency:
                    description: Frequency in milliseconds.
                    format: int32
                    minimum: 1
                    type: integer
                  intensity:
                    description: Intensity is the APA102 luminance, 0-31.
                    format: int32
                    maximum: 31
                    minimum: 0
                    type: integer
                type: object
              images:
                description: Images overrides the node component images.
                properties:
                  agent:
                    description: Agent is the image holding /node-agent, used in agent
                      mode.
                    type: string
                  driver:
                    description: Driver is the dra-driver image used in cdi mode.
                    type: string
                type: object
              legacyCompat:
                description: |-
                  LegacyCompat makes the agent share the strip with legacy blinkt
                  sidecars through the shared-state file, for nodes being migrated.
                type: boolean
              mode:
                default: legacy
                description: Mode selects legacy, cdi or agent.
                enum:
                - legacy
                - cdi
                - agent
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector for the node components. Defaults to arm64
                  nodes.
                type: object
              tolerations:
                description: |-
                  Tolerations for the node components. Defaults to tolerating the
                  control-plane taint.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            type: object
          status:
            description: BlinktConfigStatus is the observed Blinkt! setup.
            properties:
              agentNodes:
                description: |-
                  AgentNodes are the nodes the agent DaemonSet covers. A node that
                  leaves gets a one-shot clear Job before it is dropped from this list.
                items:
                  type: string
                type: array
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              devices:
                description: Devices is the number of published blinkt.kubedge.io
                  devices.
                format: int32
                type: integer
              mode:
                description: Mode in effect.
                enum:
                - legacy
                - cdi
                - agent
                type: string
              nodes:
                description: Nodes of the active DaemonSet.
                properties:
                  desired:
                    format: int32
                    type: integer
                  ready:
                    format: int32
                    type: integer
                required:
                - desired
                - ready
                type: object
              observedGeneration:
                description: ObservedGeneration of the spec this status reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
