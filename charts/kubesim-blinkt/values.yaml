# How the LEDs are lit:
#   agent  (default) The pod claims its LEDs through DRA (driver blinkt.kubedge.io);
#                    blinkt-operator in agent mode draws them from the claim's PixelConfig.
#                    The pod runs only a holder container: no blinkt process, no device,
#                    no privileges, no hostPath.
#   cdi              The pod claims its LEDs through DRA and runs the blinkt program
#                    unprivileged; dra-driver (blinkt-operator mode cdi) hands it
#                    /dev/gpiochip0, /run/blinkt and BLINKT_PIXELS through CDI.
#   legacy           Privileged blinkt container with hostPath /etc/kubedge, no DRA, for
#                    clusters without blinkt-operator.
blinkt:
  mode: agent
  # LEDs this release lights. index: a fixed LED (0-7); omit it to take any free LED
  # (DRA modes only). In agent mode each entry gets its own colour; in cdi mode an LED
  # without an index takes the colour of the lowest configured index.
  pixels:
    - index: 0
      color: [255, 0, 0]
  intensity: 3          # 0-31
  algorithm: fixed5     # steady (agent only) | fixed5 | fixed
  frequency: 500        # ms
  deviceClassName: blinkt-pixel.kubedge.io

nameOverride: kubesim-blinkt
# Deployment (replicaCount pods, placed by the scheduler where their LEDs are free) or
# DaemonSet (one pod per selected node).
kind: Deployment
replicaCount: 1
nodeSelector:
  blinktInstalled: "true"
tolerations: []

image:
  repository: docker.io/kubedge1/kubesim_blinkt
  tag: "0.5.2"
  pullPolicy: IfNotPresent

# agent mode: the pod's only container unless health is enabled.
holder:
  image: registry.k8s.io/pause:3.10.1

# Optional kubesim health sidecar (the configapi container of the simulator charts).
health:
  enabled: false
  repository: hack4easy/kubesim_health
  tag: "0.2.24"
  port: 8081

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi
